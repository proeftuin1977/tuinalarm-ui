<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121417">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuinalarm">
<title>Tuinalarm - schakelaars onder elkaar</title>
<style>
:root{--bg:#121417;--kaart:#1e2228;--grijs:#3a4048;--tekst:#e8eaed;--zacht:#9aa0a6;
--geel:#f2c230;--groen:#5cd68a;--oranje:#ffb347;--rood:#ff5c5c;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tekst);font:clamp(16px,4.2vw,19px)/1.4 system-ui,sans-serif;
max-width:30rem;margin:0 auto;padding:14px 14px 90px}
h1{font-size:1.3rem;margin:4px 2px 12px}
svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;
stroke-linecap:round;stroke-linejoin:round;flex:none}
.kaart{background:var(--kaart);border-radius:14px;padding:11px 13px;margin-bottom:10px}
.lab{color:var(--zacht);font-size:.74rem}
.rij{display:flex;gap:10px}.rij>*{flex:1;min-width:0}

/* schakelaars: drie grote rijen onder elkaar */
.sch{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;
color:var(--tekst);font:inherit;padding:14px 4px;min-height:66px;text-align:left;cursor:pointer}
.sch+.sch{border-top:1px solid #272c33}
.sch svg{width:30px;height:30px;color:var(--zacht)}
.sch .naam{flex:1;font-size:1.15rem}
.tog{width:62px;height:34px;border-radius:999px;border:2px solid var(--grijs);position:relative;flex:none}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--grijs)}
.sch.aan svg{color:var(--groen)}
.sch.aan .tog{border-color:var(--groen)}
.sch.aan .tog::after{left:auto;right:3px;background:var(--groen)}

/* tegels */
.tegel{display:flex;flex-direction:column;gap:6px}
.kop{display:flex;align-items:center;gap:8px;color:var(--zacht)}
.kop svg{width:22px;height:22px}
.kop span{font-size:.74rem}
.groot{font-size:1.45rem;font-weight:700;line-height:1}
.klein{font-size:.8rem;color:var(--zacht);font-weight:400}
.paar{display:flex;align-items:center;gap:6px}
.paar svg{width:19px;height:19px;color:var(--zacht)}
.paar+.paar{margin-left:12px}
.regel{display:flex;align-items:center}
.balk{height:6px;background:var(--grijs);border-radius:3px;overflow:hidden}
.balk i{display:block;height:100%;background:var(--groen)}
.stippen{display:flex;gap:7px;flex-wrap:wrap}
.stippen b{width:13px;height:13px;border-radius:50%;background:var(--groen)}
.stippen b.r{background:var(--rood)}.stippen b.x{background:var(--grijs);outline:1.5px solid var(--oranje)}
.groen{color:var(--groen)}.rood{color:var(--rood)}.geel{color:var(--geel)}.oranje{color:var(--oranje)}

.melding{display:flex;align-items:center;gap:10px;color:var(--rood)}
.melding span{flex:1}
.melding small{color:var(--zacht);font-size:.78rem}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid #23272e;
display:flex;max-width:30rem;margin:0 auto}
.nav div{flex:1;text-align:center;padding:8px 0 7px;font-size:.68rem;color:var(--zacht)}
.nav div svg{display:block;margin:0 auto 2px;width:24px;height:24px}
.nav div.aan{color:var(--geel)}
</style>

<svg width="0" height="0" style="position:absolute">
 <defs>
  <symbol id="schild" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></symbol>
  <symbol id="camera" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="sensor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6"/><path d="M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="persoon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></symbol>
  <symbol id="pir" viewBox="0 0 24 24"><path d="M3 12h4l2-5 3 10 2-5h7"/></symbol>
  <symbol id="data" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="accu" viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10.5v3M7 10v4M11 10v4"/></symbol>
  <symbol id="start" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></symbol>
  <symbol id="live" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 10l4 2-4 2z"/></symbol>
  <symbol id="opn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
  <symbol id="inst" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
 </defs>
</svg>

<h1>Tuinalarm</h1>

<div class="kaart" style="padding:4px 13px">
  <button class="sch aan"><svg><use href="#schild"/></svg><span class="naam">Bewakingssysteem</span><span class="tog"></span></button>
  <button class="sch aan"><svg><use href="#camera"/></svg><span class="naam">Camera</span><span class="tog"></span></button>
  <button class="sch aan"><svg><use href="#sensor"/></svg><span class="naam">Sensoren</span><span class="tog"></span></button>
</div>

<div class="kaart melding">
  <svg><use href="#sensor"/></svg><span>Terras — beweging</span><small>nu</small>
</div>

<div class="rij">
  <div class="kaart tegel">
    <div class="kop"><svg><use href="#camera"/></svg><span>Camera</span></div>
    <div class="regel">
      <div class="paar"><svg><use href="#pir"/></svg><span class="groot">12</span></div>
      <div class="paar"><svg><use href="#persoon"/></svg><span class="groot geel">3</span></div>
    </div>
    <div class="klein">gevoeligheid hoog</div>
  </div>
  <div class="kaart tegel">
    <div class="kop"><svg><use href="#sensor"/></svg><span>Sensoren</span></div>
    <div class="stippen"><b></b><b class="r"></b><b></b><b class="x"></b><b></b></div>
    <div class="klein"><span class="rood">1 beweging</span> · <span class="oranje">1 weg?</span></div>
  </div>
</div>

<div class="rij">
  <div class="kaart tegel">
    <div class="kop"><svg><use href="#data"/></svg><span>Data</span></div>
    <div class="groot">3,4 <span class="klein">GB over</span></div>
    <div class="balk"><i style="width:66%"></i></div>
  </div>
  <div class="kaart tegel">
    <div class="kop"><svg><use href="#accu"/></svg><span>Accu</span></div>
    <div class="groot">82<span class="klein">%</span></div>
    <div class="balk"><i style="width:82%"></i></div>
  </div>
</div>

<div class="nav">
  <div class="aan"><svg><use href="#start"/></svg>start</div>
  <div><svg><use href="#live"/></svg>live</div>
  <div><svg><use href="#opn"/></svg>opnames</div>
  <div><svg><use href="#inst"/></svg>instellingen</div>
</div>

<script>
document.querySelectorAll(".sch").forEach(b =>
  b.addEventListener("click", () => b.classList.toggle("aan")));
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</html>
