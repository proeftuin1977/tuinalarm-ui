<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121417">
<link rel="manifest" href="manifest.webmanifest">
<title>Tuinalarm - rustig</title>
<style>
:root{--bg:#121417;--kaart:#1e2228;--grijs:#3a4048;--tekst:#e8eaed;--zacht:#9aa0a6;
--geel:#f2c230;--groen:#5cd68a;--oranje:#ffb347;--rood:#ff5c5c;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tekst);font:clamp(17px,4.5vw,20px)/1.35 system-ui,sans-serif;
max-width:30rem;margin:0 auto;padding:0 14px 90px}
.terug{position:sticky;top:0;z-index:99;display:block;background:#0c0e11;color:#f2c230;
padding:14px 16px;margin:0 -14px 12px;text-decoration:none;font:600 17px system-ui;border-bottom:1px solid #23272e}
h1{font-size:1.35rem;margin:2px 2px 12px}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.kaart{background:var(--kaart);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.titel{color:var(--zacht);font-size:.85rem}
.getal{font-size:2.3rem;font-weight:700;line-height:1.1}
.geel{color:var(--geel)}.groen{color:var(--groen)}.rood{color:var(--rood)}

/* een kaart met drie schakelaars: naam, pictogram, aan of uit */
.drie{display:flex;padding:6px}
.drie button{flex:1;min-width:0;background:none;border:0;border-radius:11px;color:var(--zacht);font:inherit;
display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px;cursor:pointer}
.drie button+button{border-left:1px solid #272c33;border-radius:0}
.drie .naam{font-size:1rem;color:var(--tekst)}
.drie svg{width:40px;height:40px;stroke-width:1.5}
.drie .stand{font-size:1.1rem;font-weight:700}
.drie .stand::before{content:"uit"}
.drie button.aan{color:var(--groen)}
.drie button.aan .stand::before{content:"aan"}
.drie button:active{background:#272c33}

.melding{color:var(--rood);font-weight:700;font-size:1.1rem;display:flex;justify-content:space-between;
align-items:center;padding:12px 16px}
.melding small{color:var(--zacht);font-weight:400;font-size:.85rem}

.paar{display:flex;gap:12px}
.paar .kaart{flex:1;min-width:0;text-align:center;padding:12px 10px}
.vierkant{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;gap:4px}
.vierkant .getal{font-size:2.9rem}
.sub{font-size:.9rem;color:var(--zacht)}

.data{display:flex;justify-content:space-between;align-items:baseline}
.data b{font-size:1.45rem}
.data span{font-size:.9rem;color:var(--zacht);margin-left:4px}
.balk{height:9px;background:var(--grijs);border-radius:5px;overflow:hidden;margin-top:10px}
.balk i{display:block;height:100%;background:var(--groen)}

.knop{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:12px;
background:transparent;color:var(--geel);border:1.5px solid var(--grijs);text-decoration:none;font-size:1.05rem}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid #23272e;
display:flex;max-width:30rem;margin:0 auto}
.nav div{flex:1;text-align:center;padding:9px 0 8px;font-size:.72rem;color:var(--zacht)}
.nav div svg{display:block;margin:0 auto 3px;width:24px;height:24px}
.nav div.aan{color:var(--geel)}
</style>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="schild" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></symbol>
<symbol id="camera" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="sensor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6"/><path d="M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></symbol>
<symbol id="start" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></symbol>
<symbol id="live" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 10l4 2-4 2z"/></symbol>
<symbol id="opn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
<symbol id="inst" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
</defs></svg>

<a class="terug" href="./">&larr; Versies</a>
<h1>Tuinalarm</h1>

<div class="kaart drie">
  <button class="aan"><span class="naam">Bewaking</span><svg><use href="#schild"/></svg><span class="stand"></span></button>
  <button class="aan"><span class="naam">Camera</span><svg><use href="#camera"/></svg><span class="stand"></span></button>
  <button class="aan"><span class="naam">Sensoren</span><svg><use href="#sensor"/></svg><span class="stand"></span></button>
</div>

<div class="kaart melding"><span>Terras: beweging</span><small>nu</small></div>

<div class="paar">
  <div class="kaart"><p class="titel">PIR vandaag</p><div class="getal">12</div></div>
  <div class="kaart"><p class="titel">Personen vandaag</p><div class="getal geel">3</div></div>
</div>

<div class="kaart">
  <div class="data"><p class="titel">Data</p><div><b>3,4</b><span>GB over</span></div></div>
  <div class="balk"><i style="width:66%"></i></div>
</div>

<div class="paar">
  <div class="kaart vierkant"><p class="titel">Sensoren</p><div class="getal">5</div><p class="sub rood">1 beweging</p></div>
  <div class="kaart vierkant"><p class="titel">Accu</p><div class="getal groen">82%</div></div>
</div>

<a class="knop" href="#">Live bekijken</a>

<div class="nav">
  <div class="aan"><svg><use href="#start"/></svg>start</div>
  <div><svg><use href="#live"/></svg>live</div>
  <div><svg><use href="#opn"/></svg>opnames</div>
  <div><svg><use href="#inst"/></svg>instellingen</div>
</div>

<script>
document.querySelectorAll(".drie button").forEach(b =>
  b.addEventListener("click", () => b.classList.toggle("aan")));
</script>
</html>
